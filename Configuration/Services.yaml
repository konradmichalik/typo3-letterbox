services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  KonradMichalik\Typo3Letterbox\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Command/SendTestMailsCommand.php'
      - '../Classes/Command/ListCommand.php'
      - '../Classes/Command/ShowCommand.php'
      - '../Classes/Command/ClearCommand.php'
      - '../Classes/Command/ReceiveCommand.php'
      # Implements an interface of EXT:reports, which is optional. Registered in Services.php when it is installed.
      - '../Classes/Report/*'
      # Implements an interface of EXT:dashboard, which is optional. Registered in Services.php when it is installed.
      - '../Classes/Widgets/*'

  cache.typo3_letterbox_index:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['typo3_letterbox_index']

  KonradMichalik\Typo3Letterbox\Domain\Repository\MailRepositoryFactory:
    # Public for LetterboxTransport, which TYPO3 instantiates without dependency injection.
    public: true
    arguments:
      $cache: '@cache.typo3_letterbox_index'

  KonradMichalik\Typo3Letterbox\Mail\RetentionService:
    # Public for LetterboxTransport, which TYPO3 instantiates without dependency injection.
    public: true

  KonradMichalik\Typo3Letterbox\Domain\Repository\MailRepository:
    public: true
    factory: ['@KonradMichalik\Typo3Letterbox\Domain\Repository\MailRepositoryFactory', 'create']
