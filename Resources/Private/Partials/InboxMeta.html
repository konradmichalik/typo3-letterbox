<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<div class="letterbox-titlebar">
    <h1><f:translate key="inbox.heading" extensionName="Typo3Letterbox" /></h1>
    <p class="text-variant letterbox-meta">
        <f:translate key="inbox.meta" extensionName="Typo3Letterbox" /><f:if condition="{active}"><f:else> · <f:translate key="inbox.inactive.meta" extensionName="Typo3Letterbox" /></f:else></f:if><f:if condition="{configured} && ({active} || {browse})"> · <code>{path}</code> · <f:if condition="{total} == 1"><f:then><f:translate key="inbox.count.one" extensionName="Typo3Letterbox" /></f:then><f:else><f:translate key="inbox.count" extensionName="Typo3Letterbox" arguments="{0: total}" /></f:else></f:if> · <f:format.bytes value="{size}" /><f:if condition="{retention}"> · {retention}</f:if></f:if>
    </p>
</div>

</html>
