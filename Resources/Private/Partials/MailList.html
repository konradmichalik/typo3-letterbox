<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<form id="{clearFormId}" method="post" action="{f:be.uri(route: 'system_letterbox.clear')}">
    <input type="hidden" name="letterboxToken" value="{token}" />
</form>

<div class="card letterbox-list">
    <div class="card-header">
        <span class="fw-bold" id="letterbox-list-label"><f:translate key="inbox.mailList" extensionName="Typo3Letterbox" /></span>
        <span class="text-variant">{total}</span>
    </div>
    <ul class="list-group list-group-flush" aria-labelledby="letterbox-list-label">
        <f:for each="{mails}" as="mail">
            <f:variable name="url" value="{f:be.uri(route: 'system_letterbox.show', parameters: {id: mail.id, page: page})}" />
            <f:variable name="isSelected" value="{f:if(condition: '{mail.id} == {selectedId}', then: 1, else: 0)}" />
            <li class="list-group-item list-group-item-action p-0{f:if(condition: isSelected, then: ' active')}">
                <f:if condition="{isSelected}">
                    <f:then>
                        <a href="{url}" class="letterbox-row text-reset text-decoration-none" aria-current="true"><f:render section="RowContent" arguments="{mail: mail, isSelected: isSelected, listDates: listDates}" /></a>
                    </f:then>
                    <f:else>
                        <a href="{url}" class="letterbox-row text-reset text-decoration-none"><f:render section="RowContent" arguments="{mail: mail, isSelected: isSelected, listDates: listDates}" /></a>
                    </f:else>
                </f:if>
            </li>
        </f:for>
    </ul>
    <f:if condition="{paginator.numberOfPages} > 1">
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span aria-live="polite">
                <f:translate key="inbox.pagination.range" extensionName="Typo3Letterbox" arguments="{0: pagination.startRecordNumber, 1: pagination.endRecordNumber, 2: total}" />
            </span>
            <nav aria-label="{f:translate(key: 'inbox.pagination', extensionName: 'Typo3Letterbox')}">
                <ul class="pagination mb-0">
                    <f:if condition="{pagination.previousPageNumber}">
                        <li class="page-item">
                            <a class="page-link" href="{f:be.uri(route: 'system_letterbox', parameters: {page: pagination.previousPageNumber})}" title="{f:translate(key: 'inbox.pagination.previous', extensionName: 'Typo3Letterbox')}">
                                <span aria-hidden="true"><core:icon identifier="actions-chevron-left" /></span>
                                <span class="visually-hidden"><f:translate key="inbox.pagination.previous" extensionName="Typo3Letterbox" /></span>
                            </a>
                        </li>
                    </f:if>
                    <f:for each="{pagination.allPageNumbers}" as="pageNumber">
                        <f:if condition="{pageNumber} == {paginator.currentPageNumber}">
                            <f:then>
                                <li class="page-item active"><a class="page-link" href="{f:be.uri(route: 'system_letterbox', parameters: {page: pageNumber})}" aria-current="page">{pageNumber}</a></li>
                            </f:then>
                            <f:else>
                                <li class="page-item"><a class="page-link" href="{f:be.uri(route: 'system_letterbox', parameters: {page: pageNumber})}">{pageNumber}</a></li>
                            </f:else>
                        </f:if>
                    </f:for>
                    <f:if condition="{pagination.nextPageNumber}">
                        <li class="page-item">
                            <a class="page-link" href="{f:be.uri(route: 'system_letterbox', parameters: {page: pagination.nextPageNumber})}" title="{f:translate(key: 'inbox.pagination.next', extensionName: 'Typo3Letterbox')}">
                                <span aria-hidden="true"><core:icon identifier="actions-chevron-right" /></span>
                                <span class="visually-hidden"><f:translate key="inbox.pagination.next" extensionName="Typo3Letterbox" /></span>
                            </a>
                        </li>
                    </f:if>
                </ul>
            </nav>
        </div>
    </f:if>
</div>

<f:section name="RowContent">
    <span class="d-flex justify-content-between gap-2">
        <span class="text-truncate fw-bold"><f:render section="LinkText" arguments="{mail: mail}" /></span>
        <f:if condition="{listDates.{mail.id}}">
            <small class="text-nowrap">{listDates.{mail.id}}</small>
        </f:if>
    </span>
    <span class="d-flex justify-content-between align-items-center gap-2">
        <small class="text-truncate{f:if(condition: isSelected, else: ' text-variant')}">
            <f:render section="AddressName" arguments="{address: mail.from}" />
            <f:if condition="{mail.to.0}">
                <f:translate key="inbox.to" extensionName="Typo3Letterbox" />
                <f:render section="AddressName" arguments="{address: mail.to.0}" />
            </f:if>
        </small>
        <f:if condition="{mail.attachments}">
            <span class="flex-shrink-0" aria-hidden="true"><core:icon identifier="actions-file" size="small" /></span>
        </f:if>
    </span>
</f:section>

<f:section name="LinkText"><f:if condition="{mail.subject}"><f:then>{mail.subject}</f:then><f:else><f:translate key="inbox.noSubject" extensionName="Typo3Letterbox" /></f:else></f:if><f:if condition="{mail.attachments}"><span class="visually-hidden">, <f:translate key="inbox.hasAttachments" extensionName="Typo3Letterbox" /></span></f:if></f:section>

<f:section name="AddressName">
    <f:if condition="{address}">
        <f:then>{f:if(condition: address.name, then: address.name, else: address.address)}</f:then>
        <f:else><f:translate key="inbox.unknownSender" extensionName="Typo3Letterbox" /></f:else>
    </f:if>
</f:section>

</html>
