<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<div class="card" data-letterbox-region="detail">
    <div class="card-body text-center">
        <f:render partial="EmptyIllustration" arguments="{width: 150}" />
        <h2 class="h4"><f:translate key="inbox.noSelection.title" extensionName="Typo3Letterbox" /></h2>
        <p class="text-variant mb-0"><f:translate key="inbox.noSelection.sentence" extensionName="Typo3Letterbox" /></p>
    </div>
</div>

</html>
