<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <main>
        <div class="letterbox-titlebar">
            <h1><f:translate key="access.heading" extensionName="Typo3Letterbox" /></h1>
        </div>

        <div class="callout callout-warning">
            <div class="callout-icon" aria-hidden="true">
                <span class="icon-emphasized"><core:icon identifier="actions-exclamation" /></span>
            </div>
            <div class="callout-content">
                <div class="callout-title"><f:translate key="access.warning.title" extensionName="Typo3Letterbox" /></div>
                <div class="callout-body"><f:translate key="access.warning.body" extensionName="Typo3Letterbox" /></div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-xl-6">
                <f:render section="Status" arguments="{_all}" />
            </div>
            <div class="col-xl-6">
                <f:render section="Connect" arguments="{_all}" />
            </div>
        </div>
    </main>
</f:section>

<f:section name="Status">
    <section class="card h-100" aria-labelledby="letterbox-access-status-title">
        <div class="card-header"><h2 class="h5 mb-0" id="letterbox-access-status-title"><f:translate key="access.status.heading" extensionName="Typo3Letterbox" /></h2></div>
        <div class="card-body">
            <f:if condition="{active}">
                <f:then>
                    <p class="fw-bold"><f:translate key="access.status.on" extensionName="Typo3Letterbox" /></p>
                </f:then>
                <f:else>
                    <p class="fw-bold mb-1"><f:translate key="access.status.off" extensionName="Typo3Letterbox" /></p>
                    <p><f:translate key="access.status.offHint" extensionName="Typo3Letterbox" /></p>
                    <ul>
                        <f:for each="{reasons}" as="reason"><li>{reason}</li></f:for>
                    </ul>
                </f:else>
            </f:if>
            <dl class="row mb-0">
                <dt class="col-sm-4 text-variant fw-normal"><f:translate key="access.status.context" extensionName="Typo3Letterbox" /></dt>
                <dd class="col-sm-8"><code>{context}</code></dd>
                <dt class="col-sm-4 text-variant fw-normal"><f:translate key="access.status.switch" extensionName="Typo3Letterbox" /></dt>
                <dd class="col-sm-8"><code class="text-break">LETTERBOX_EXTERNAL_ACCESS={context}</code></dd>
                <dt class="col-sm-4 text-variant fw-normal"><f:translate key="access.token" extensionName="Typo3Letterbox" /></dt>
                <dd class="col-sm-8 mb-0"><f:if condition="{tokenConfigured}"><f:then><f:translate key="access.token.configured" extensionName="Typo3Letterbox" /></f:then><f:else><f:translate key="access.token.missing" extensionName="Typo3Letterbox" /></f:else></f:if></dd>
            </dl>
        </div>
    </section>
</f:section>

<f:section name="Connect">
    <section class="card h-100" aria-labelledby="letterbox-access-connect-title">
        <div class="card-header"><h2 class="h5 mb-0" id="letterbox-access-connect-title"><f:translate key="access.connect.heading" extensionName="Typo3Letterbox" /></h2></div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-4 text-variant fw-normal"><f:translate key="access.connect.inbox" extensionName="Typo3Letterbox" /></dt>
                <dd class="col-sm-8"><code class="text-break">{inboxUrl}</code></dd>
                <dt class="col-sm-4 text-variant fw-normal"><f:translate key="access.connect.api" extensionName="Typo3Letterbox" /></dt>
                <dd class="col-sm-8 mb-0"><code class="text-break">{apiUrl}</code></dd>
            </dl>
            <p><f:translate key="{f:if(condition: testerLink, then: 'access.connect.share', else: 'access.connect.shareWithoutToken')}" extensionName="Typo3Letterbox" /></p>
            <p class="text-variant mb-1"><f:translate key="access.connect.example" extensionName="Typo3Letterbox" /></p>
            <pre class="mb-0"><code>curl -H "X-Letterbox-Token: &lt;token&gt;" {apiUrl}/messages</code></pre>
        </div>
    </section>
</f:section>

</html>
