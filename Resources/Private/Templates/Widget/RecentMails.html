<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Widget/Widget" />
<f:section name="main">
    <f:if condition="{configured}">
        <f:then>
            <f:if condition="{mails}">
                <f:then>
                    <ul class="list-unstyled mb-0" aria-label="{f:translate(key: 'LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.latest')}">
                        <f:for each="{mails}" as="mail">
                            <li class="mb-2">
                                <f:if condition="{mail.url}">
                                    <f:then><a href="{mail.url}"><f:render section="Subject" arguments="{mail: mail}" /></a></f:then>
                                    <f:else><f:render section="Subject" arguments="{mail: mail}" /></f:else>
                                </f:if>
                                <br>
                                <small class="text-variant">
                                    <f:if condition="{mail.from}">{mail.from}</f:if>
                                    <f:if condition="{mail.received}">
                                        <f:if condition="{mail.from}"> · </f:if>
                                        <time datetime="{mail.received -> f:format.date(format: 'c')}"><f:format.date format="Y-m-d H:i">{mail.received}</f:format.date></time>
                                    </f:if>
                                </small>
                            </li>
                        </f:for>
                    </ul>
                </f:then>
                <f:else>
                    <p><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.empty" /></p>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <p><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:widget.notConfigured" /></p>
        </f:else>
    </f:if>
    <f:if condition="{active}">
        <f:else>
            <p class="text-variant"><small><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:widget.notActive" /></small></p>
        </f:else>
    </f:if>
</f:section>
<f:section name="footer">
    <f:if condition="{openUrl}">
        <a class="btn btn-default" href="{openUrl}"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.open" /></a>
    </f:if>
</f:section>

<f:section name="Subject">
    <f:if condition="{mail.subject}"><f:then><f:format.crop maxCharacters="60" append="…">{mail.subject}</f:format.crop></f:then><f:else><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:inbox.noSubject" /></f:else></f:if>
</f:section>
</html>
