<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<p class="dropdown-headline"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.heading" /></p>
<f:if condition="{takeover}">
    <f:variable name="takeoverBy" value="{f:translate(key: 'LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:takeover.by.{takeover.by}')}" />
    <p class="dropdown-item-text text-variant"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.takeover" arguments="{0: takeoverBy, 1: takeover.original}" /></p>
</f:if>
<f:if condition="{state} == 'ok'">
    <f:then>
        <p class="dropdown-item-text"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.intro" /></p>
        <p class="dropdown-item-text text-variant"><f:if condition="{total} == 1"><f:then><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.summary.one" arguments="{0: count}" /></f:then><f:else><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.summary.other" arguments="{0: total, 1: count}" /></f:else></f:if></p>
        <hr class="dropdown-divider" aria-hidden="true">
        <f:if condition="{mails}">
            <f:then>
                <ul class="dropdown-list" aria-label="{f:translate(key: 'LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.latest')}">
                    <f:for each="{mails}" as="mail">
                        <li>
                            <f:if condition="{mail.url}">
                                <f:then>
                                    <a class="dropdown-item" href="{mail.url}">
                                        <f:render section="Mail" arguments="{mail: mail}" />
                                    </a>
                                </f:then>
                                <f:else>
                                    <span class="dropdown-item-text">
                                        <f:render section="Mail" arguments="{mail: mail}" />
                                    </span>
                                </f:else>
                            </f:if>
                        </li>
                    </f:for>
                </ul>
            </f:then>
            <f:else>
                <p class="dropdown-item-text"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.empty" /></p>
            </f:else>
        </f:if>
        <f:if condition="{openUrl}">
            <hr class="dropdown-divider" aria-hidden="true">
            <div class="dropdown-item-text">
                <a class="btn btn-default btn-sm" href="{openUrl}"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.open" /></a>
            </div>
        </f:if>
    </f:then>
    <f:else>
        <f:switch expression="{state}">
            <f:case value="invalid"><p class="dropdown-item-text"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.invalidSettings" /></p></f:case>
            <f:case value="unreadable"><p class="dropdown-item-text"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.unreadable" /></p></f:case>
            <f:defaultCase><p class="dropdown-item-text"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:toolbar.notConfigured" /></p></f:defaultCase>
        </f:switch>
    </f:else>
</f:if>

<f:section name="Mail">
    <span class="dropdown-item-columns">
        <span class="dropdown-item-column dropdown-item-column-text">
            <span{f:if(condition: mail.unread, then: ' class="fw-bold"')}><f:if condition="{mail.unread}"><span class="visually-hidden"><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:inbox.unread" /></span> </f:if><f:if condition="{mail.subject}"><f:then><f:format.crop maxCharacters="60" append="…">{mail.subject}</f:format.crop></f:then><f:else><f:translate key="LLL:EXT:typo3_letterbox/Resources/Private/Language/locallang.xlf:inbox.noSubject" /></f:else></f:if></span>
            <f:if condition="{mail.time}"><br><small class="text-variant"><f:format.date format="Y-m-d H:i">{mail.time}</f:format.date></small></f:if>
        </span>
    </span>
</f:section>
</html>
