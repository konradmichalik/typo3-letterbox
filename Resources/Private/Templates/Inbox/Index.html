<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <main>
        <f:render partial="InboxMeta" arguments="{_all}" />

        <f:if condition="{configured} && {total} > 0">
            <f:then>
                <div class="letterbox-inbox{f:if(condition: listCollapsed, then: ' letterbox-inbox--collapsed')}" data-letterbox-index="{f:be.uri(route: 'system_letterbox')}" data-letterbox-show="{f:be.uri(route: 'system_letterbox.show')}">
                    <f:render partial="InboxStatus" />
                    <f:render partial="MailList" arguments="{_all}" />
                    <f:render partial="MailPlaceholder" />
                </div>
            </f:then>
            <f:else>
                <f:if condition="{configured}">
                    <f:then>
                        <f:render section="NoMails" arguments="{_all}" />
                    </f:then>
                    <f:else>
                        <div class="callout callout-info">
                            <div class="callout-icon" aria-hidden="true">
                                <span class="icon-emphasized">
                                    <core:icon identifier="actions-envelope" />
                                </span>
                            </div>
                            <div class="callout-content">
                                <div class="callout-title"><f:translate key="inbox.empty.notConfigured" extensionName="Typo3Letterbox" /></div>
                                <div class="callout-body">
                                    <p><f:translate key="inbox.empty.howto" extensionName="Typo3Letterbox" /></p>
                                    <pre class="mb-0"><code>$GLOBALS['TYPO3_CONF_VARS']['MAIL']['transport'] = \KonradMichalik\Typo3Letterbox\Mail\LetterboxTransport::class;
$GLOBALS['TYPO3_CONF_VARS']['MAIL']['transport_mbox_file'] = '/var/www/html/var/log/mails.mbox';</code></pre>
                                </div>
                            </div>
                        </div>
                    </f:else>
                </f:if>
            </f:else>
        </f:if>
    </main>
</f:section>

<f:section name="NoMails">
    <section class="letterbox-empty text-center" aria-labelledby="letterbox-empty-title">
        <f:render partial="EmptyIllustration" arguments="{width: 240}" />
        <h2 id="letterbox-empty-title"><f:translate key="inbox.empty.noMails" extensionName="Typo3Letterbox" /></h2>
        <p><f:translate key="inbox.empty.sentence" extensionName="Typo3Letterbox" /></p>
        <p>
            <a class="btn btn-default" href="{f:be.uri(route: 'system_letterbox')}">
                <span aria-hidden="true"><core:icon identifier="actions-refresh" /></span>
                <f:translate key="inbox.reload" extensionName="Typo3Letterbox" />
            </a>
        </p>
        <f:if condition="{debugMode}">
            <p class="text-variant"><f:translate key="inbox.empty.debugHint" extensionName="Typo3Letterbox" /> <code>vendor/bin/typo3 letterbox:testmails:send</code></p>
        </f:if>
    </section>
</f:section>

</html>
